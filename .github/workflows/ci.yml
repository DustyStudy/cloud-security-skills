name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint (ruff)
        run: |
          pip install --quiet "ruff==0.16.9"
          ruff check .

      - name: Structure tests (manifests, frontmatter, links, catalog fields)
        run: |
          pip install --quiet "pytest==9.1.1"
          python3 -m pytest tests -q
