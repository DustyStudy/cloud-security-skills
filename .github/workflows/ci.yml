name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Hash-pinned, including transitive deps (regen command in the requirements-dev.txt header).
      - name: Install dev tools
        run: |
          python3 -m venv "$RUNNER_TEMP/dev"
          "$RUNNER_TEMP/dev/bin/pip" install --quiet --require-hashes --only-binary=:all: -r requirements-dev.txt

      - name: Lint (ruff)
        run: '"$RUNNER_TEMP/dev/bin/ruff" check .'

      - name: Structure tests (manifests, frontmatter, links, catalog fields)
        run: '"$RUNNER_TEMP/dev/bin/python" -m pytest tests -q'
